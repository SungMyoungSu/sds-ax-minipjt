goal: Windows PC에서 Claude Desktop과 로컬 Python MCP 서버로 동작하는 개인용 봉사활동 에이전트를 만든다. 회사원은
  사내규정(MD/PDF)에서 사용자가 확인한 규칙으로, 학생은 진로 연계 기록과 선택적 목표로 봉사 시간을 관리한다. 1365·청소년 공공 API로
  봉사를 추천하고, .ics와 이메일로 마감을 알리며, 회사 제출용 보고서와 학생 포트폴리오를 PDF로 만든다. 모든 데이터는 사용자 PC에만 저장한다.
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- '개발 환경: Windows 11, Python 3.13 + uv, 이 PC에서만 실행. 프로젝트 루트는 C:\Users\SDS\mini-pjt
  (git 저장소), Seed는 mini-pjt\seeds\에 보관.'
- '실행 구조: Claude Desktop + 로컬 Python MCP 서버(stdio). 저장소는 SQLite, 확인서 원본은 로컬 데이터 폴더에
  복사 보관. 서버는 LLM API를 직접 호출하지 않는다(규칙 추출 해석·전공 연계 설명은 호스트 Claude가 수행).'
- '사용자: 개인 회사원과 학생(본인과 지인). HR/CSR 관리자 기능 없음. 사용자당 기준 프로필 여러 개 허용(source = company_policy
  | school_requirement | self_goal | none, 목표 시간 선택).'
- 사내규정 입력은 .md 또는 텍스트 PDF만. DOCX·HWP·OCR 미지원. 규정 검색은 임베딩 없이 BM25. 추출 규칙은 사용자 확인 후에만
  계산에 사용.
- '활동 기록 필드: 날짜, 기관, 내용, 시간(0.5시간 단위), 활동 유형(1365 분야 코드 고정 목록), 확인서 첨부, 학생은 전공 연관성·배운
  점. 사내규정 인정 유형은 규칙 확인 단계에서 이 목록에 매핑하고 사용자가 확정.'
- '추천 데이터: data.go.kr 1365 봉사참여정보 API(15157582)와 청소년 봉사 프로그램 API(15156325), 사용자 개인
  서비스 키. 신청 대행 없음, 원문 링크만. 관심 목록 저장 도구 제공(모집 마감 알림용).'
- '알림: .ics 파일 + 사용자 본인 SMTP 이메일(Gmail 앱 비밀번호 가능). Windows 작업 스케줄러로 하루 1회 점검(놓친 실행은
  다음 기동 시). 알림 시점 D-30/D-7/D-1. 대화 시작 시 다가오는 마감 안내.'
- '비밀 정보: claude_desktop_config.json 수동 등록 + 로컬 .env(DATA_GO_KR_KEY, SMTP_HOST, SMTP_PORT,
  SMTP_USER, SMTP_PASSWORD, ALERT_EMAIL_TO). .env는 git 제외, 동기화 폴더 밖 보관 안내. MSIX판 Claude
  Desktop 설정 경로(%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude)와
  일반판(%APPDATA%\Claude)을 모두 안내.'
- 보고서 PDF는 한글 폰트(맑은 고딕 또는 번들 Noto Sans KR)를 임베드.
- '제외 범위(v1): 신청 대행, HR 대시보드, DOCX/HWP 입력, OCR, 1365 개인 실적 자동 연동, 웹·모바일 배포, macOS
  지원.'
- 학생 핵심 가치는 진로 연계(대입 시간 채우기 아님). 2024 대입부터 학교 밖 개인 봉사는 대입에 반영되지 않으므로 대입 혜택을 약속하지 않는다.
- 알림 자동 검증은 대체 테스트(fixture, RFC 5545 검증, 로컬 SMTP sink, MCP 핸드셰이크)로 하고 실제 캘린더 가져오기·Claude
  Desktop 재시작은 수동 체크리스트로 남긴다.
acceptance_criteria:
- description: 'AC1 규칙 확정: 예시 사내규정 .md와 텍스트 PDF fixture를 입력하면 기준 프로필 규칙 후보(목표 시간,
    기준 기간, 인정 활동 유형 코드, 확인서 필수 여부)가 반환되고, 사용자 확인 도구 호출 전에는 시간 계산·알림에 반영되지 않는다 (pytest).'
  semantic_ac_key: ac_f10f9482ae17c8b2
- description: 'AC2 규정 Q&A: 규정 검색 도구가 반환하는 근거는 항상 원문의 그대로인 부분 문자열(조항 인용)이며, 근거가 없으면
    ''규정에서 확인되지 않음'' 표식을 반환한다 (pytest).'
  semantic_ac_key: ac_033184daf7e6ff7c
- description: 'AC3 시간 계산: 목표 8시간 프로필에 3시간 활동을 기록하면 남은 시간 5시간이 반환되고, 확인서 필수 프로필에서는
    확인서 없는 활동이 ''미인정(증빙 대기)''으로 별도 집계된다. 시간 단위는 0.5시간, 시간대는 Asia/Seoul (pytest).'
  semantic_ac_key: ac_8e6ab321d04992f1
- description: 'AC4 목표 없는 프로필: source가 none인 학생 프로필은 남은 시간 없이 누적 시간과 진로 연계 기록(전공과의
    연관성, 배운 점)만 반환한다 (pytest).'
  semantic_ac_key: ac_4c7a1c2dc32e8ee5
- description: 'AC5 추천: 녹화된 1365 봉사참여정보 API와 청소년 봉사 프로그램 API XML fixture(정상, 빈 결과,
    오류 코드, 페이지네이션)로 지역·기간·분야·모집 상태 필터와 원문 링크가 검증되고, DATA_GO_KR_KEY가 설정된 경우에만 라이브 스모크
    테스트가 실행된다(없으면 skip). 신청 대행 도구는 존재하지 않는다 (pytest).'
  semantic_ac_key: ac_dd78e4d19eb18158
- description: 'AC6 장애 내성: API 키가 없거나 호출이 실패하면 원인과 해결 방법이 안내되고, 기록·프로필·보고서 도구는 계속
    동작한다 (pytest).'
  semantic_ac_key: ac_83e4d080938dc65e
- description: 'AC7 .ics: 마감 등록 시 생성된 .ics가 icalendar 파서로 RFC 5545 검증(VCALENDAR/VEVENT,
    안정적 UID, DTSTAMP, Asia/Seoul 날짜, VALARM -P30D/-P7D/-P1D)을 통과한다 (pytest). 실제 Google
    Calendar/Outlook 가져오기는 수동 체크리스트.'
  semantic_ac_key: ac_e6dba92be894d516
- description: 'AC8 이메일·대화 시작 안내: 로컬 SMTP sink와 주입한 ''오늘'' 날짜로 D-7 조건에서 수신자·제목·본문이
    맞는 메일이 1회만 발송되고 재실행 시 중복 발송되지 않는다. get_upcoming_deadlines 도구가 7일 이내 마감을 임박순으로
    반환하고 서버 instructions가 대화 시작 시 이를 호출하도록 지시한다 (pytest).'
  semantic_ac_key: ac_14876acf06827a1d
- description: 'AC9 보고서: 회사원 보고서 PDF와 학생 진로 연계 포트폴리오 PDF가 생성되고, pypdf로 추출한 텍스트(한글
    포함)가 DB 기록과 일치한다 (pytest).'
  semantic_ac_key: ac_59f813ae1feec0d2
- description: 'AC10 로컬 데이터: 네트워크를 차단한 테스트에서 MCP 서버의 외부 통신은 data.go.kr 호스트와 설정된 SMTP
    호스트로만 허용되며, 모든 데이터·확인서 사본은 로컬 데이터 폴더에만 저장된다 (pytest).'
  semantic_ac_key: ac_3a007cd70f29fe45
- description: 'AC11 다중 프로필: 회사 프로필(8시간, 인정 유형 제한)과 개인 목표 프로필(20시간)이 있을 때 인정 유형에 맞는
    3시간 활동은 두 프로필 모두에, 인정 유형이 아닌 활동은 개인 목표 프로필에만 반영된다. 활동 유형은 1365 분야 코드 기반 고정 목록이다
    (pytest).'
  semantic_ac_key: ac_bde7b7909514929d
- description: 'AC12 기간 경계: 12/31 활동은 이전 기준 기간, 1/1 활동은 새 기준 기간에 집계되고, 여러 날 활동은 시작일
    기준이다 (pytest).'
  semantic_ac_key: ac_4e4b702d516de0b1
- description: 'AC13 비밀 정보: .env가 없거나 키가 빠져도 서버가 기동해 설정 방법을 안내하고, 가짜 키 값이 로그·도구 출력·예외
    메시지 어디에도 나타나지 않는다 (pytest).'
  semantic_ac_key: ac_17127e0d52b113ab
- description: 'AC14 설치: 설치 안내의 claude_desktop_config.json 예시가 유효한 JSON이고 uv 명령을 가리키며,
    stdio로 기동한 서버에 MCP initialize + tools/list 핸드셰이크를 하면 기대 도구 이름 목록이 반환된다 (pytest).
    Claude Desktop 재시작 후 도구 표시는 수동 체크리스트.'
  semantic_ac_key: ac_79bf44b1f9161f3c
- description: 'AC15 품질 게이트: 프로젝트 루트에서 `uv run pytest`가 통과한다(라이브 테스트는 skip 허용).'
  semantic_ac_key: ac_6c15fe53a1798cf6
