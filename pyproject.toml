[project]
name = "volunteer-agent"
version = "0.1.0"
description = "개인용 봉사활동 추천·관리 에이전트"
requires-python = ">=3.13"
dependencies = [
    "pypdf>=6.21.4",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
volunteer-agent = "volunteer_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volunteer_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
