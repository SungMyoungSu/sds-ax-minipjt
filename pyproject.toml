[project]
name = "volunteer-agent"
version = "0.1.0"
description = "개인용 봉사활동 추천·관리 에이전트"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.10,<4",
    "icalendar>=7.3.0",
    "langchain-aws>=1.9.1",
    "langchain-chroma>=1.1.0",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-supervisor>=0.0.31",
    "mcp>=1.9,<2",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "reportlab>=5.1.0",
    "tzdata>=2024.1",
]

[project.scripts]
volunteer-agent = "volunteer_agent.cli:main"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volunteer_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: Bedrock·공공 API 실연동 (자격 증명이 없으면 skip)"]
filterwarnings = ["ignore:create_react_agent has been moved:DeprecationWarning", "ignore::langgraph.warnings.LangGraphDeprecatedSinceV10"]
